<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lazy Loading Images Practice</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .spacer {
      height: 120vh; /* big gap to force scrolling */
    }

    .image-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 400px;
    }

    img {
      width: 600px;
      height: 400px;
      object-fit: cover;
      background: #ddd;
    }
  </style>
</head>
<body>

  <h1 style="text-align:center; padding:40px;">
    Scroll Down to Load Images
  </h1>

  <div class="spacer"></div>

  <div class="image-container">
    <img 
      src="https://via.placeholder.com/600x400?text=Placeholder"
      data-src="https://picsum.photos/id/1015/600/400"
      alt="Image 1"
      class="lazy-image"
    >
  </div>

  <div class="spacer"></div>

  <div class="image-container">
    <img 
      src="https://via.placeholder.com/600x400?text=Placeholder"
      data-src="https://picsum.photos/id/1025/600/400"
      alt="Image 2"
      class="lazy-image"
    >
  </div>

  <div class="spacer"></div>

  <div class="image-container">
    <img 
      src="https://via.placeholder.com/600x400?text=Placeholder"
      data-src="https://picsum.photos/id/1035/600/400"
      alt="Image 3"
      class="lazy-image"
    >
  </div>

  <div class="spacer"></div>

  <div class="image-container">
    <img 
      src="https://via.placeholder.com/600x400?text=Placeholder"
      data-src="https://picsum.photos/id/1045/600/400"
      alt="Image 4"
      class="lazy-image"
    >
  </div>

  <div class="spacer"></div>

  <script src="lazy-loading.js"></script>

</body>
</html>
